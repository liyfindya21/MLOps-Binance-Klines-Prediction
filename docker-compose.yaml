

services:
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow_tracker
    ports:
      - "5000:5000"
    # Biarkan dia berjalan default tanpa mounting volume database yang bikin locking
    command: mlflow server --host 0.0.0.0 --port 5000
    networks:
      - mlops-network

  model-serving-api:
    build: .
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - NO_PROXY=mlflow-server,localhost,127.0.0.1
      - no_proxy=mlflow-server,localhost,127.0.0.1
    deploy:
      replicas: 3
    depends_on:
      - mlflow-server
    networks:
      - mlops-network

  # TAMBAHKAN SERVICE NGINX DI SINI
  nginx-load-balancer:
    image: nginx:latest
    container_name: nginx_gateway
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - model-serving-api
    networks:
      - mlops-network

  # ... (Service prometheus dan grafana biarkan sama seperti sebelumnya)

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - model-serving-api
    networks:
      - mlops-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge