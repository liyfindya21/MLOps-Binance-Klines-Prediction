version: '3.8'

services:
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_tracker
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    working_dir: /app
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 5000 
      --backend-store-uri sqlite:///mlruns/mlflow.db 
      --default-artifact-root /app/mlruns
    networks:
      - mlops-network

  model-serving-api:
    image: btc-model-api:latest
    ports:
      - "8000-8002:8080" # KUNCI: Mengalokasikan port 8000, 8001, dan 8002 secara otomatis untuk tiap replika
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    deploy:
      replicas: 3
    depends_on:
      - mlflow-server
    networks:
      - mlops-network
networks:
  mlops-network:
    driver: bridge